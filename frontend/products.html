<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Shri Amman Agro Traders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: block; background: #f4f8f3; }
        .page-shell { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
        .topbar h1 { font-size: 2rem; color: var(--primary-color); }
        .topbar p { color: var(--text-muted); margin-top: 6px; }
        .card { background: white; border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 10px 30px rgba(47, 107, 56, 0.08); }
        .content-grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; }
        .panel { padding: 20px; }
        .form-grid { display: grid; gap: 14px; }
        .form-grid input, .form-grid select, .form-grid textarea { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: 10px; font-family: inherit; font-size: 1rem; background: #fbfdfb; }
        .form-grid textarea { min-height: 90px; resize: vertical; }
        .button-row { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
        .secondary-btn { background: white; color: var(--primary-color); border: 1px solid var(--border-color); padding: 0.8rem 1rem; border-radius: 10px; cursor: pointer; font-family: inherit; font-weight: 600; }
        .secondary-btn:hover { background: #f3f7f3; }
        .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border-color); background: #ffffff; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #E8F2E9; color: #1F3822; font-weight: 700; padding: 12px 10px; border-bottom: 2px solid #C8E0CB; text-transform: uppercase; font-size: 0.82rem; letter-spacing: 0.04em; }
        td { padding: 12px 10px; border-bottom: 1px solid #E5EFE6; font-size: 0.92rem; vertical-align: middle; text-align: left; }
        tbody tr:nth-child(even) td { background-color: #FFFFFF; }
        tbody tr:nth-child(odd) td { background-color: #F4F8F4; }
        td.actions { white-space: nowrap; vertical-align: middle; }
        .actions button { display: inline-flex; align-items: center; justify-content: center; border: none; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.85rem; font-weight: 600; white-space: nowrap; margin-right: 6px; vertical-align: middle; }
        .actions button:last-child { margin-right: 0; }
        .edit-btn { background: #e8f2eb; color: var(--primary-color); transition: background 0.2s; }
        .edit-btn:hover { background: #d3e7d8; }
        .delete-btn { background: #fde8e8; color: #b91c1c; transition: background 0.2s; }
        .delete-btn:hover { background: #fbd0d0; }
        .search-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .search-row input, .search-row select { flex: 1; min-width: 180px; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 24px 0; }
        .hidden { display: none; }

        /* Unified Navbar */
        .navbar {
            display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; margin-bottom: 24px;
            background: #ffffff; padding: 12px 16px; border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); align-items: center;
            scrollbar-width: none;
        }
        .navbar::-webkit-scrollbar { display: none; }
        .navbar-brand { font-weight: 700; color: #2F6B38; font-size: 1.1rem; margin-right: 12px; }
        .nav-link {
            text-decoration: none; color: #1F2937; background: #f3f7f3;
            padding: 0.6rem 1.2rem; border-radius: 999px; border: 1px solid #E5E7EB;
            font-weight: 600; font-size: 0.9rem; transition: all 0.2s;
        }
        .nav-link:hover { background: #e6f0e7; color: #2F6B38; }
        .nav-link.active { background: #2F6B38; color: white; border-color: #2F6B38; }
        .nav-link.logout { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
        .nav-link.logout:hover { background: #fee2e2; color: #991b1b; }

        @media (max-width: 980px) { .content-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="navbar" id="top-nav"></div>
        <div class="topbar">
            <div>
                <h1>Product Management</h1>
                <p>Maintain products, categories, units, and inventory-ready records.</p>
            </div>
        </div>

        <div class="content-grid">
            <div class="card panel">
                <h3 id="form-title">Add Product</h3>
                <div id="form-error" class="alert error hidden"></div>
                <form id="product-form" class="form-grid">
                    <input type="hidden" id="product-id">
                    <label><span>Product Name</span><input type="text" id="productName" required></label>
                    <label><span>Company</span><select id="companyId" required></select></label>
                    <label><span>Category</span><select id="categoryId" required></select></label>
                    <label><span>Unit</span><select id="unitId" required></select></label>
                    <label><span>Status</span><select id="status"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></label>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                        <label><span>HSN Code</span><input type="text" id="hsnCode" placeholder="e.g. 3101"></label>
                        <label><span>GST Rate (%)</span><select id="gstRate"><option value="0">0% (Exempt)</option><option value="5">5%</option><option value="12">12%</option><option value="18">18%</option><option value="28">28%</option></select></label>
                    </div>
                    <label><span>Description</span><textarea id="description"></textarea></label>
                    <div class="button-row">
                        <button type="submit" class="primary-btn">Save Product</button>
                        <button type="button" id="cancel-edit" class="secondary-btn hidden">Cancel</button>
                    </div>
                </form>
                <hr style="margin: 18px 0; border: none; border-top: 1px solid #edf2ed;">
                <h4>Add Category</h4>
                <form id="category-form" class="form-grid" style="margin-top: 12px;">
                    <label><span>Category Name</span><input type="text" id="categoryName" required></label>
                    <label><span>Description</span><input type="text" id="categoryDescription"></label>
                    <button type="submit" class="secondary-btn">Add Category</button>
                </form>
                <h4 style="margin-top: 16px;">Add Unit</h4>
                <form id="unit-form" class="form-grid" style="margin-top: 12px;">
                    <label><span>Unit Name</span><input type="text" id="unitName" required></label>
                    <label><span>Abbreviation</span><input type="text" id="unitAbbreviation" required></label>
                    <button type="submit" class="secondary-btn">Add Unit</button>
                </form>
            </div>

            <div class="card panel">
                <h3>Products</h3>
                <div class="search-row">
                    <input type="text" id="search-input" placeholder="Search products or company">
                    <select id="company-filter"><option value="">All Companies</option></select>
                    <select id="category-filter"><option value="">All Categories</option></select>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Product</th>
                                <th>Company</th>
                                <th>Category</th>
                                <th>Unit</th>
                                <th>HSN</th>
                                <th>GST%</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="product-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/nav.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
