<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Management - Shri Amman Agro Traders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: block; background: #f4f8f3; }
        .page-shell { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
        .topbar h1 { font-size: 2rem; color: var(--primary-color); }
        .topbar p { color: var(--text-muted); margin-top: 6px; }
        .card { background: white; border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 10px 30px rgba(47, 107, 56, 0.08); }
        .content-grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
        .panel { padding: 20px; }
        .form-grid { display: grid; gap: 14px; }
        .form-grid input, .form-grid select { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: 10px; font-family: inherit; font-size: 1rem; background: #fbfdfb; }
        .button-row { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
        .secondary-btn { background: white; color: var(--primary-color); border: 1px solid var(--border-color); padding: 0.8rem 1rem; border-radius: 10px; cursor: pointer; font-family: inherit; font-weight: 600; }
        .secondary-btn:hover { background: #f3f7f3; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #edf2ed; font-size: 0.95rem; }
        th { background: #f7fbf7; color: #4b5563; font-weight: 600; }
        .search-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .search-row input { flex: 1; min-width: 220px; }
        .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #e9f5ea; color: var(--primary-color); font-size: 0.82rem; font-weight: 600; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 24px 0; }
        .hidden { display: none; }

        /* Unified Navbar */
        .navbar {
            display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; margin-bottom: 24px;
            background: #ffffff; padding: 12px 16px; border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); align-items: center;
            scrollbar-width: none;
        }
        .navbar::-webkit-scrollbar { display: none; }
        .navbar-brand { font-weight: 700; color: #2F6B38; font-size: 1.1rem; margin-right: 12px; }
        .nav-link {
            text-decoration: none; color: #1F2937; background: #f3f7f3;
            padding: 0.6rem 1.2rem; border-radius: 999px; border: 1px solid #E5E7EB;
            font-weight: 600; font-size: 0.9rem; transition: all 0.2s;
        }
        .nav-link:hover { background: #e6f0e7; color: #2F6B38; }
        .nav-link.active { background: #2F6B38; color: white; border-color: #2F6B38; }
        .nav-link.logout { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
        .nav-link.logout:hover { background: #fee2e2; color: #991b1b; }

        @media (max-width: 980px) { .content-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="navbar" id="top-nav"></div>
        <div class="topbar">
            <div>
                <h1>Price Management</h1>
                <p>Maintain current and historical purchase and selling prices.</p>
            </div>
        </div>

        <div class="content-grid">
            <div class="card panel">
                <h3>Update Price</h3>
                <div id="form-error" class="alert error hidden"></div>
                <form id="price-form" class="form-grid">
                    <label><span>Product</span><select id="productId" required></select></label>
                    <label><span>Purchase Price</span><input type="number" id="purchasePrice" min="0" step="0.01" required></label>
                    <label><span>Selling Price</span><input type="number" id="sellingPrice" min="0" step="0.01" required></label>
                    <div class="button-row">
                        <button type="submit" class="primary-btn">Save Price</button>
                    </div>
                </form>
            </div>

            <div class="card panel">
                <h3>Current Prices</h3>
                <div class="search-row">
                    <input type="text" id="search-input" placeholder="Search product or company">
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Company</th>
                                <th>Purchase</th>
                                <th>Selling</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="price-table-body"></tbody>
                    </table>
                </div>
                <hr style="margin: 18px 0; border: none; border-top: 1px solid #edf2ed;">
                <h4>Price History</h4>
                <div id="price-history" style="margin-top: 12px;"></div>
            </div>
        </div>
    </div>

    <script src="js/prices.js"></script>
</body>
</html>
