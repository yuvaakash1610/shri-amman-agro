<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shri Amman Agro Traders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="split-layout">
        <!-- Left Side: Branding / Imagery -->
        <div class="brand-section">
            <div class="brand-overlay"></div>
            <div class="brand-content">
                <div>
                    <img src="images/logo.png" style="height: 110px; width: 110px; object-fit: contain; margin-bottom: 15px;">
                </div>
                <h1>Shri Amman<br>Agro Traders</h1>
                <p>Advanced Inventory & Management System</p>
            </div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="form-section">
            <div class="form-container">
                <h2>Welcome Back</h2>
                <p class="subtitle">Please enter your details to sign in.</p>

                <div id="error-message" class="alert error hidden">
                    <!-- Error messages will appear here -->
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input type="email" id="email" name="email" required placeholder="admin@shriammanagro.com" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
                            <button type="button" id="toggle-password" class="icon-btn" aria-label="Toggle password visibility">
                                <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-actions-row">
                        <label class="checkbox-container">
                            <input type="checkbox" id="remember-me" name="remember-me">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <button type="submit" id="login-btn" class="primary-btn">
                        <span class="btn-text">Sign In</span>
                        <div class="loader hidden"></div>
                    </button>

                    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                        <span style="color: var(--text-muted);">Don't have an account?</span>
                        <a href="register.html" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Sign up here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
