<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Shri Amman Agro Traders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="split-layout">
        <!-- Left Side: Branding / Imagery -->
        <div class="brand-section">
            <div class="brand-overlay"></div>
            <div class="brand-content">
                <div>
                    <img src="images/logo.png" style="height: 110px; width: 110px; object-fit: contain; margin-bottom: 15px;">
                </div>
                <h1>Shri Amman<br>Agro Traders</h1>
                <p>Advanced Inventory & Management System</p>
            </div>
        </div>

        <!-- Right Side: Reset Password Form -->
        <div class="form-section">
            <div class="form-container">
                <h2>Reset Password</h2>
                <p class="subtitle">Enter your registered email and choose a new password.</p>

                <div id="error-message" class="alert error hidden">
                    <!-- Error messages will appear here -->
                </div>

                <div id="success-message" class="alert success hidden" style="background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0;">
                    <!-- Success messages will appear here -->
                </div>

                <form id="reset-form">
                    <div class="form-group">
                        <label for="email">Registered Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="password">New Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" name="password" required placeholder="••••••••" minlength="6">
                            <button type="button" id="toggle-password" class="icon-btn" aria-label="Toggle password visibility">
                                <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                        <small style="color: var(--text-muted); font-size: 0.8rem; margin-top: 4px; display: block;">Must be at least 6 characters</small>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••••" minlength="6">
                        </div>
                    </div>

                    <button type="submit" id="reset-btn" class="primary-btn">
                        <span class="btn-text">Update Password</span>
                        <div class="loader hidden"></div>
                    </button>

                    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                        <span style="color: var(--text-muted);">Remember your password?</span>
                        <a href="index.html" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Back to Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="js/forgot-password.js"></script>
</body>
</html>
