<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Shri Amman Agro Traders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #F8FAF9; margin: 0; padding: 2rem; color: #1F2937; }
        .dashboard-container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #E5E7EB; padding-bottom: 1rem; margin-bottom: 2rem; }
        .role-badge { background-color: #2F6B38; color: white; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.875rem; font-weight: 500; }
        button { background-color: #EF4444; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-family: inherit; }
        button:hover { background-color: #DC2626; }
        .content { font-size: 1.1rem; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <div>
                <h1>Dashboard</h1>
                <p>Welcome back, <span id="user-name">Loading...</span></p>
            </div>
            <div>
                <span class="role-badge" id="user-role">Role</span>
                <button id="logout-btn" style="margin-left: 1rem;">Logout</button>
            </div>
        </div>
        <div class="content">
            <p>This is a protected page. Your authentication token was successfully verified by the backend API.</p>
            <p>Data fetched from `/api/auth/me`:</p>
            <pre id="api-data" style="background: #F3F4F6; padding: 1rem; border-radius: 6px; overflow-x: auto;"></pre>
        </div>
    </div>
    <script src="js/dashboard.js"></script>
</body>
</html>
