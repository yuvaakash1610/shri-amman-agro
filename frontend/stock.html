<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Management - Shri Amman Agro Traders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: block; background: #f4f8f3; }
        .page-shell { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
        .topbar h1 { font-size: 2rem; color: var(--primary-color); }
        .topbar p { color: var(--text-muted); margin-top: 6px; }
        .card { background: white; border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 10px 30px rgba(47, 107, 56, 0.08); }
        .content-grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
        .panel { padding: 20px; }
        .form-grid { display: grid; gap: 14px; }
        .form-grid input, .form-grid select, .form-grid textarea { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: 10px; font-family: inherit; font-size: 1rem; background: #fbfdfb; }
        .button-row { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
        .secondary-btn { background: white; color: var(--primary-color); border: 1px solid var(--border-color); padding: 0.8rem 1rem; border-radius: 10px; cursor: pointer; font-family: inherit; font-weight: 600; }
        .secondary-btn:hover { background: #f3f7f3; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #edf2ed; font-size: 0.95rem; }
        th { background: #f7fbf7; color: #4b5563; font-weight: 600; }
        .actions button { margin-right: 6px; border: none; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-family: inherit; }
        .search-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .search-row input { flex: 1; min-width: 220px; }
        .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #e9f5ea; color: var(--primary-color); font-size: 0.82rem; font-weight: 600; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 24px 0; }
        .hidden { display: none; }
        .navbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
        .nav-link { text-decoration: none; color: var(--text-main); background: white; padding: 0.7rem 1rem; border-radius: 999px; border: 1px solid var(--border-color); font-weight: 600; }
        .nav-link.active { background: var(--primary-color); color: white; }
        @media (max-width: 980px) { .content-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="navbar" id="top-nav"></div>
        <div class="topbar">
            <div>
                <h1>Stock Management</h1>
                <p>Track stock levels, movement history, and reorder warnings.</p>
            </div>
        </div>

        <div class="content-grid">
            <div class="card panel">
                <h3>Stock Movement</h3>
                <div id="form-error" class="alert error hidden"></div>
                <form id="stock-form" class="form-grid">
                    <label><span>Product</span><select id="productId" required></select></label>
                    <label><span>Movement Type</span><select id="movementType" required>
                        <option value="PURCHASE">Purchase</option>
                        <option value="SALE">Sale</option>
                        <option value="RETURN">Return</option>
                        <option value="DAMAGE">Damage</option>
                        <option value="ADJUSTMENT">Adjustment</option>
                    </select></label>
                    <label><span>Quantity</span><input type="number" id="quantity" min="0" required></label>
                    <label><span>Reason</span><input type="text" id="reason"></label>
                    <div class="button-row">
                        <button type="submit" class="primary-btn">Update Stock</button>
                    </div>
                </form>
            </div>

            <div class="card panel">
                <h3>Current Stock</h3>
                <div class="search-row">
                    <input type="text" id="search-input" placeholder="Search product code or name">
                    <label><input type="checkbox" id="low-stock-filter"> Low stock only</label>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Code</th>
                                <th>Quantity</th>
                                <th>Reorder</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="stock-table-body"></tbody>
                    </table>
                </div>
                <hr style="margin: 18px 0; border: none; border-top: 1px solid #edf2ed;">
                <h4>Movement History</h4>
                <div id="movement-history" style="margin-top: 12px;"></div>
            </div>
        </div>
    </div>

    <script src="js/stock.js"></script>
</body>
</html>
